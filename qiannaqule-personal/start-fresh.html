<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>MiRun AI - 全新启动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f8fafc;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 40px 24px;
    background:
      radial-gradient(ellipse at top, rgba(249, 115, 22, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at bottom, rgba(249, 115, 22, 0.08) 0%, transparent 40%),
      #0f172a;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; box-shadow: 0 4px 20px rgba(249, 115, 22, 0.3);
  }
  .icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 14px; color: #94a3b8; margin-bottom: 32px; text-align: center; line-height: 1.6; }
  .bar {
    width: 100%; max-width: 280px; height: 6px;
    background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
    margin-bottom: 16px;
  }
  .bar-fill {
    height: 100%; width: 5%;
    background: linear-gradient(90deg, #f97316, #fb923c);
    border-radius: 3px; transition: width 0.3s ease;
  }
  .status { font-size: 13px; color: #64748b; }
  .ok { display: none; margin-top: 8px; font-size: 14px; color: #4ade80; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
  </div>
  <h1>正在启动 MiRun AI</h1>
  <p class="sub">清除旧缓存，加载最新版本<br>你的数据全部保留，放心</p>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="status" id="status">准备中...</div>
  <div class="ok" id="okIcon">✓ 完成</div>
</div>

<script>
(function() {
  var barFill = document.getElementById('barFill');
  var statusEl = document.getElementById('status');
  var okEl = document.getElementById('okIcon');
  var progress = 5;

  function setProgress(p, text) {
    progress = p;
    barFill.style.width = p + '%';
    if (text) statusEl.textContent = text;
  }

  function finish() {
    setProgress(100, '启动完成，正在进入...');
    okEl.style.display = 'block';
    setTimeout(function() {
      // 跳转到主页，带时间戳确保不被任何缓存拦截
      window.location.replace('./index.html?_fresh=' + Date.now());
    }, 800);
  }

  var tasks = [];

  // 1. 注销所有 Service Worker
  if ('serviceWorker' in navigator) {
    setProgress(20, '正在清理旧缓存...');
    tasks.push(
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        var promises = regs.map(function(r) { return r.unregister(); });
        return Promise.all(promises);
      }).catch(function() {})
    );
  }

  // 2. 清除所有 Cache Storage
  if ('caches' in window) {
    tasks.push(
      caches.keys().then(function(keys) {
        var promises = keys.map(function(k) { return caches.delete(k); });
        return Promise.all(promises);
      }).catch(function() {})
    );
  }

  // 3. 清版本标记
  try {
    localStorage.removeItem('mirun_app_version');
    localStorage.removeItem('mijieai_app_version');
  } catch(e) {}

  Promise.all(tasks).then(function() {
    setProgress(75, '加载最新版本...');
    // 等一下给用户视觉反馈
    setTimeout(finish, 500);
  }).catch(function() {
    // 失败也跳转，不要卡住
    finish();
  });

  // 保底：最多3秒强制跳转
  setTimeout(finish, 3000);
})();
</script>
</body>
</html>
